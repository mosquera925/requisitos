<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HM - Requisitos de Crédito</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #e9edf3;
    font-family: 'Segoe UI', Arial, sans-serif;
    padding: 15px;
}

.formulario {
    width: 100%;
    max-width: 360px;
    background: #fff;
    margin: auto;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 8px 22px rgba(0,0,0,.12);
}

.logo {
    text-align: center;
    font-size: 30px;
    font-weight: 900;
    color: #111827;
    margin-bottom: 3px;
}

.subtitulo {
    text-align: center;
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 16px;
}

label {
    display: block;
    margin-top: 11px;
    font-size: 13px;
    font-weight: 700;
    color: #111827;
}

input, select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 14px;
    background: #fff;
}

input:focus, select:focus {
    outline: none;
    border-color: #111827;
}

input[readonly] {
    background: #f3f4f6;
    font-weight: 600;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #111827;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}

button:hover {
    background: #000;
}

button:disabled {
    opacity: .6;
    cursor: wait;
}

/* TICKET COMPACTO PARA PNG */

#ticketPNG {
    position: fixed;
    left: -10000px;
    top: 0;
    width: 320px;
    background: #fff;
    color: #111827;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.ticket-header {
    background: #111827;
    color: #fff;
    padding: 12px 10px;
    text-align: center;
}

.ticket-logo {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 3px;
}

.ticket-header h1 {
    font-size: 19px;
    letter-spacing: 1.5px;
}

.ticket-header p {
    font-size: 10px;
    margin-top: 3px;
}

.ticket-body {
    padding: 12px 14px 10px;
    font-size: 11px;
    line-height: 1.35;
}

.titulo {
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 5px;
}

.info {
    margin-bottom: 4px;
    overflow-wrap: anywhere;
}

.linea {
    border-top: 1px dashed #9ca3af;
    margin: 8px 0;
}

.requisitos {
    padding-left: 17px;
    margin-top: 4px;
}

.requisitos li {
    margin-bottom: 3px;
    padding-left: 1px;
    overflow-wrap: anywhere;
}

.resumen {
    background: #f3f4f6;
    border-radius: 7px;
    padding: 8px 10px;
    margin-top: 9px;
}

.resumen div {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
    font-size: 11px;
}

.resumen div:last-child {
    margin-bottom: 0;
}

.resumen strong {
    flex-shrink: 0;
}

.mensaje {
    margin-top: 9px;
    font-size: 10px;
    line-height: 1.4;
    text-align: left;
}

.footer {
    text-align: center;
    font-size: 9px;
    font-weight: 700;
    color: #6b7280;
    margin-top: 9px;
    padding-top: 6px;
    border-top: 1px solid #e5e7eb;
}

@media (max-width: 400px) {
    body {
        padding: 10px;
    }

    .formulario {
        padding: 16px;
    }
}
</style>
</head>

<body>

<div class="formulario">

    <div class="logo"></div>
    <div class="subtitulo">Formulario de información de crédito</div>

    <label for="cliente">Cliente</label>
    <input type="text" id="cliente" placeholder="Nombre completo"
           maxlength="100" autocomplete="name">

    <label for="tipoCredito">Tipo de crédito</label>
    <select id="tipoCredito">
        <option>Consumo</option>
        <option>Vehicular</option>
        <option>Hipotecario</option>
        <option>Microcrédito</option>
        <option>Empresarial</option>
        <option>Educativo</option>
        <option>Salud</option>
        <option>Productivo</option>
        <option>Comercial</option>
        <option>Unificación de Deudas</option>
        <option>Inversión</option>
        <option>Libre Inversión</option>
    </select>

    <label for="monto">Monto</label>
    <select id="monto">
        <option value="">Seleccione</option>
        <option value="3000">$3.000</option>
        <option value="5000">$5.000</option>
        <option value="6000">$6.000</option>
        <option value="7000">$7.000</option>
        <option value="8000">$8.000</option>
        <option value="10000">$10.000</option>
        <option value="12000">$12.000</option>
        <option value="15000">$15.000</option>
        <option value="18000">$18.000</option>
        <option value="20000">$20.000</option>
        <option value="22000">$22.000</option>
        <option value="25000">$25.000</option>
        <option value="27000">$27.000</option>
        <option value="28000">$28.000</option>
        <option value="30000">$30.000</option>
        <option value="32000">$32.000</option>
        <option value="35000">$35.000</option>
        <option value="38000">$38.000</option>
        <option value="40000">$40.000</option>
        <option value="43000">$43.000</option>
        <option value="45000">$45.000</option>
        <option value="48000">$48.000</option>
        <option value="50000">$50.000</option>
        <option value="55000">$55.000</option>
        <option value="60000">$60.000</option>
    </select>

    <label for="plazo">Plazo</label>
    <select id="plazo">
        <option value="">Seleccione</option>
        <option value="24">24 meses</option>
        <option value="36">36 meses</option>
        <option value="48">48 meses</option>
        <option value="60">60 meses</option>
        <option value="72">72 meses</option>
        <option value="84">84 meses</option>
    </select>

    <label for="garantia">Garantía</label>
    <input id="garantia" type="text" readonly placeholder="Automático">

    <label for="cuota">Cuota mensual</label>
    <input id="cuota" type="text" readonly placeholder="Automático">

    <label for="interes">Interés</label>
    <input id="interes" type="text" readonly placeholder="Automático">

    <button type="button" id="btnDescargar" onclick="generarPNG()">
        DESCARGAR REQUISITOS PNG
    </button>

</div>

<!-- TICKET QUE SE CONVERTIRÁ EN IMAGEN -->

<div id="ticketPNG">

    <div class="ticket-header">
        <div class="ticket-logo">HM</div>
        <h1>REQUISITOS</h1>
        <p>ESTA INFORMACION ES GRATUITA</p>
    </div>

    <div class="ticket-body" id="contenidoTicket"></div>

</div>

<script>
"use strict";

/*
 * TABLA ORIGINAL DE CUOTAS Y GARANTÍAS.
 * Los valores se conservan tal como fueron proporcionados.
 */

const tabla = {
    3000:  {24:132, 36:89,   48:67,   60:54,   72:46,  84:40,  garantia:369},
    5000:  {24:220, 36:148,  48:112,  60:90,   72:76,  84:66,  garantia:409},
    6000:  {24:264, 36:177,  48:134,  60:108,  72:91,  84:79,  garantia:479},
    7000:  {24:308, 36:207,  48:156,  60:126,  72:106, 84:92,  garantia:539},
    8000:  {24:352, 36:236,  48:178,  60:144,  72:121, 84:105, garantia:609},

    10000: {24:440, 36:295,  48:223,  60:180,  72:151, 84:131, garantia:799},
    12000: {24:528, 36:354,  48:267,  60:215,  72:181, 84:157, garantia:939},
    15000: {24:660, 36:442,  48:334,  60:269,  72:227, 84:196, garantia:1149},
    18000: {24:792, 36:530,  48:401,  60:323,  72:272, 84:235, garantia:1359},
    20000: {24:880, 36:589,  48:445,  60:359,  72:302, 84:261, garantia:1499},
    22000: {24:968, 36:648,  48:490,  60:395,  72:332, 84:287, garantia:1549},
    25000: {24:1099,36:737,  48:556,  60:448,  72:377, 84:326, garantia:1599},
    27000: {24:1187,36:795,  48:601,  60:484,  72:407, 84:352, garantia:1719},
    28000: {24:1231,36:825,  48:623,  60:502,  72:422, 84:365, garantia:1779},
    30000: {24:1319,36:884,  48:668,  60:538,  72:453, 84:391, garantia:1899},

    32000: {24:1407,36:943,  48:712,  60:574,  72:483, 84:417, garantia:2019},
    35000: {24:1539,36:1031, 48:779,  60:628,  72:528, 84:457, garantia:2199},
    38000: {24:1671,36:1119, 48:846,  60:681,  72:573, 84:496, garantia:2379},
    40000: {24:1759,36:1178, 48:890,  60:717,  72:603, 84:522, garantia:2499},
    43000: {24:1891,36:1267, 48:957,  60:771,  72:648, 84:561, garantia:2679},

    45000: {24:1979,36:1325, 48:1001, 60:807,  72:679, 84:587, garantia:2849},
    48000: {24:2110,36:1414, 48:1068, 60:860,  72:724, 84:626, garantia:3029},
    50000: {24:2198,36:1473, 48:1112, 60:896,  72:754, 84:652, garantia:3149},
    55000: {24:2418,36:1620, 48:1224, 60:986,  72:829, 84:717, garantia:3449},
    60000: {24:2638,36:1767, 48:1335, 60:1075, 72:905, 84:782, garantia:3749}
};

const interesTabla = {
    24: 5.5,
    36: 6,
    48: 6.75,
    60: 7.5,
    72: 8.5,
    84: 9.45
};

const campoMonto = document.getElementById("monto");
const campoPlazo = document.getElementById("plazo");
const campoGarantia = document.getElementById("garantia");
const campoCuota = document.getElementById("cuota");
const campoInteres = document.getElementById("interes");

/* FORMATO DE DINERO */

function dinero(valor) {
    return "$" + Number(valor).toLocaleString("es-EC", {
        maximumFractionDigits: 2
    });
}

/* CÁLCULO AUTOMÁTICO */

campoMonto.addEventListener("change", calcular);
campoPlazo.addEventListener("change", calcular);

function calcular() {
    const monto = campoMonto.value;
    const plazo = campoPlazo.value;

    if (tabla[monto] && plazo && tabla[monto][plazo] !== undefined) {
        campoCuota.value = dinero(tabla[monto][plazo]);
        campoGarantia.value = dinero(tabla[monto].garantia);
        campoInteres.value = interesTabla[plazo] + "%";
    } else {
        campoCuota.value = "";
        campoGarantia.value = "";
        campoInteres.value = "";
    }
}

/* EVITA INTERPRETAR DATOS DEL CLIENTE COMO HTML */

function escaparHTML(texto) {
    return String(texto).replace(/[&<>"']/g, function(caracter) {
        const equivalencias = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        };

        return equivalencias[caracter];
    });
}

/* GENERAR Y DESCARGAR IMAGEN PNG */

async function generarPNG() {
    const boton = document.getElementById("btnDescargar");

    const cliente = document.getElementById("cliente").value.trim();
    const credito = document.getElementById("tipoCredito").value;
    const monto = campoMonto.value;
    const plazo = campoPlazo.value;
    const garantia = campoGarantia.value;
    const cuota = campoCuota.value;
    const interes = campoInteres.value;

    if (!cliente) {
        alert("Ingrese el nombre del cliente.");
        document.getElementById("cliente").focus();
        return;
    }

    if (!monto || !plazo || !garantia || !cuota || !interes) {
        alert("Seleccione el monto y el plazo para calcular los valores.");
        return;
    }

    if (typeof html2canvas === "undefined") {
        alert("No se pudo cargar el generador de imágenes. Verifique su conexión a internet.");
        return;
    }

    boton.disabled = true;
    boton.textContent = "GENERANDO IMAGEN...";

    try {
        const contenido = document.getElementById("contenidoTicket");

        contenido.innerHTML = `
            <div class="titulo">DATOS DEL CLIENTE</div>

            <div class="info">
                <strong>Cliente:</strong>
                ${escaparHTML(cliente.toUpperCase())}
            </div>

            <div class="info">
                <strong>Tipo de crédito:</strong>
                ${escaparHTML(credito)}
            </div>

            <div class="linea"></div>

            <div class="titulo">REQUISITOS</div>

            <ul class="requisitos">
                <li>Cédula de identidad</li>
                <li>Papeleta de votación</li>
                <li>Planilla de servicio básico (solo energía eléctrica)</li>
                <li>Roles de pago de los últimos 3 meses (en caso de ser dependiente)</li>
                <li>RUC o RIMPE (en caso de ser independiente)</li>
                <li>Cuenta bancaria para el desembolso</li>
                <li>Valor de garantía: ${escaparHTML(garantia)}</li>
                <li>Dos referencias personales (con certificados de honorabilidad)</li>
                <li>Correo electrónico</li>
            </ul>

            <div class="resumen">
                <div><strong>Monto:</strong><span>${escaparHTML(dinero(monto))}</span></div>
                <div><strong>Garantía:</strong><span>${escaparHTML(garantia)}</span></div>
                <div><strong>Cuota mensual:</strong><span>${escaparHTML(cuota)}</span></div>
                <div><strong>Plazo:</strong><span>${escaparHTML(plazo + " meses")}</span></div>
                <div><strong>Interés:</strong><span>${escaparHTML(interes)}</span></div>
            </div>

            <div class="mensaje">
                Para continuar con el trámite, acuda con todos los requisitos completos
                y la documentación vigente. No omita ningún documento.
            </div>

            <div class="footer">
                ESTA INFORMACION ES GRATUITA
            </div>
        `;

        const ticket = document.getElementById("ticketPNG");

        // Esperar a que el navegador calcule el tamaño real del ticket.
        await new Promise(resolve => requestAnimationFrame(resolve));

        const canvas = await html2canvas(ticket, {
            scale: 3,
            backgroundColor: "#ffffff",
            useCORS: true,
            logging: false,
            width: 320,
            windowWidth: 1200
        });

        // Convertir directamente a PNG, sin generar ningún PDF.
        const imagen = await new Promise((resolve, reject) => {
            canvas.toBlob(blob => {
                if (blob) {
                    resolve(blob);
                } else {
                    reject(new Error("No se pudo crear la imagen PNG."));
                }
            }, "image/png");
        });

        const url = URL.createObjectURL(imagen);
        const enlace = document.createElement("a");

        const nombreSeguro = cliente
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-zA-Z0-9_-]+/g, "_")
            .replace(/^_+|_+$/g, "")
            .toUpperCase() || "CLIENTE";

        enlace.href = url;
        enlace.download = nombreSeguro + "_REQUISITOS_VALIDOS.png";

        document.body.appendChild(enlace);
        enlace.click();
        enlace.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1500);

    } catch (error) {
        console.error("Error al generar PNG:", error);
        alert("No se pudo generar la imagen. Intente nuevamente.");
    } finally {
        boton.disabled = false;
        boton.textContent = "DESCARGAR REQUISITOS PNG";
    }
}
</script>

</body>
</html>
